name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  copies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Host copies of skills and LICENSE match the root
        run: scripts/sync-hosts.sh --check

  chatgpt-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ChatGPT manifests match the Agent Plugins schemas
        run: |
          pipx run check-jsonschema --schemafile https://agent-plugins.org/schemas/1.0.0/plugin.schema.json hosts/chatgpt/plugin.json
          pipx run check-jsonschema --schemafile https://agent-plugins.org/schemas/1.0.0/mcp.schema.json hosts/chatgpt/mcp.json
